[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"

# Tell Netlify where Nitro outputs the SSR function.
# Without this, Netlify looks in netlify/functions/ (default) and never
# finds the handler — every request falls through to a 404.
[functions]
  directory = ".netlify/server"
  node_bundler = "none"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

